<ion-side-menus enable-menu-with-back-views="false">
  <ion-side-menu-content>
    <ion-nav-bar class="bar-ucsal">
      <ion-nav-back-button></ion-nav-back-button>
      <ion-nav-buttons side="left">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="left"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-nav-view name="menuContent"></ion-nav-view>
  </ion-side-menu-content>

  <ion-side-menu side="left">
    <ion-header-bar class="bar-ucsal">
      <h1 class="title">Menu UCSal</h1>
    </ion-header-bar>
    <ion-content>
      <div class="item item-divider" ng-if="alunoLogado">
        {{ alunoLogado.nome }}<br>
        <small>Matrícula: {{ alunoLogado.matricula }}</small>
      </div>
      <ion-list>
        <ion-item menu-close href="#/app/noticias" class="item-icon-left">
          <i class="icon ion-ios-paper-outline"></i>
          Mural de Notícias
        </ion-item>
        <ion-item menu-close href="#/app/perfil" class="item-icon-left">
          <i class="icon ion-ios-person-outline"></i>
          Atualização Cadastral
        </ion-item>
        <ion-item menu-close href="#/app/financeiro" class="item-icon-left">
          <i class="icon ion-ios-calculator-outline"></i>
          Consulta Financeira
        </ion-item>
        <ion-item menu-close ng-click="sair()" class="item-icon-left">
          <i class="icon ion-log-out"></i>
          Sair
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-side-menu>
</ion-side-menus>
