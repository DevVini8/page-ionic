<ion-view view-title="Portal do Aluno UCSal" hide-nav-bar="true">
  <ion-content class="padding">
    <div class="login-header">
      <h2>UCSal</h2>
      <p>Portal do Aluno — Autoatendimento</p>
    </div>

    <div class="msg-erro" ng-if="erroLogin">
      {{ erroLogin }}
    </div>

    <div class="list list-inset">
      <label class="item item-input item-stacked-label">
        <span class="input-label">Matrícula</span>
        <input type="text" placeholder="Ex: 20261001" ng-model="credenciais.matricula">
      </label>
      <label class="item item-input item-stacked-label">
        <span class="input-label">Senha</span>
        <input type="password" placeholder="Ex: 123456" ng-model="credenciais.senha">
      </label>
    </div>

    <button class="button button-block button-ucsal" ng-click="entrar()">
      Acessar Portal
    </button>

    <div class="card">
      <div class="item item-text-wrap">
        <strong>Acesso de Teste:</strong><br>
        Matrícula: <code>20261001</code> | Senha: <code>123456</code>
      </div>
    </div>
  </ion-content>
</ion-view>
